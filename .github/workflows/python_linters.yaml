---

name: python_linters
on:
  pull_request:
    paths: "**.py"
  push:
    paths: "**.py"

jobs:
  flake8:
    name: Python Lint - flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 greynoise-enrichment/source/greynoise_*.py

  black:
    name: Python Lint - black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Black
        run: pip install black
      - name: Run black --check
        run: black --check --line-length=120 greynoise-enrichment/source/greynoise_*.py
